name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run tests
        run: ./scripts/test-core.sh

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RITMO_VERSION="$VERSION" \
          RITMO_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
          ./scripts/build-app.sh

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Ritmo.app \
            "dist/Ritmo-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Ritmo-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --generate-notes \
            --title "Ritmo ${GITHUB_REF_NAME}"
